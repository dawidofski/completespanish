<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Spanish Step-by-Step</title>
</head>
<body>
  <h1>Complete Spanish Step-by-Step</h1>
  <p>App shell (Step 3.1).</p>

  <script src="js/vendor/dexie.min.js"></script>
  <script src="js/db.js"></script>
  <script>
    db.open().then(function () {
      console.log('DB ready: SpanishApp (version ' + db.verno + ')');
      document.body.insertAdjacentHTML('beforeend', '<p>✓ DB ready (version ' + db.verno + ')</p>');
    }).catch(function (err) {
      console.error('DB failed to open', err);
      document.body.insertAdjacentHTML('beforeend', '<p>✗ DB failed: ' + err.message + '</p>');
    });
  </script>
</body>
</html>
