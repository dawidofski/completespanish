<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Spanish Step-by-Step</title>
</head>

<body>
  <h1>Complete Spanish Step-by-Step</h1>
  <p>App shell (Step 3.1).</p>

  <script src="js/vendor/dexie.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/import.js"></script>
  <script>
    db.open().then(function () {
      document.body.insertAdjacentHTML('beforeend', '<p>✓ DB ready (version ' + db.verno + ')</p>');
      return Importer.run();
    }).then(function (res) {
      var msg = res.imported
        ? '✓ Imported content (version ' + res.version + ')'
        : '✓ Content already current (version ' + res.version + ')';
      msg += ' — chapters=' + res.counts.chapters +
             ', questions=' + res.counts.questions +
             ', answers=' + res.counts.answers;
      console.log(msg);
      document.body.insertAdjacentHTML('beforeend', '<p>' + msg + '</p>');
    }).catch(function (err) {
      console.error('Startup failed', err);
      document.body.insertAdjacentHTML('beforeend', '<p>✗ Startup failed: ' + err.message + '</p>');
    });
  </script>
</body>

</html>
